name: CI / CD

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_target'
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install just
        uses: extractions/setup-just@v2
        with:
          just-version: "1.40.0"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: just typecheck

      - name: Lint
        run: just lint

      - name: Unit tests and scenario tests
        run: just test

      - name: Generate HTML test report
        # Best-effort: a generator error must not mask the test pass/fail signal.
        # Fails loudly in local `just ci` (no || true there); CI wraps it here.
        run: just report || true

      - name: Publish test report (dorny)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest
          path: test-results/junit.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Headless smoke check
        run: just smoke

      - name: Web build (PR preview)
        if: github.event_name == 'pull_request'
        env:
          VITE_BASE_URL: /JenesBoot/pr-${{ github.event.pull_request.number }}/
        run: just build

      - name: Web build (production)
        if: github.event_name != 'pull_request'
        run: just build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # -----------------------------------------------------------------------
  # PR deploys are sequentialized via needs: chains to prevent gh-pages
  # push races. All three jobs write to separate destination_dir paths
  # and use keep_files: true, so they are safe to run in any order, but
  # a concurrent push to gh-pages causes "remote: fatal error in
  # commit_refs". Running them in a chain (preview → qa → test-report)
  # makes each push atomic and eliminates the race entirely without adding
  # any retry dependency.
  # -----------------------------------------------------------------------

  deploy-preview:
    name: deploy preview
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy PR preview to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

  deploy-test-report:
    name: deploy test report
    needs: deploy-preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Deploy test report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: test-results/
          destination_dir: pr-${{ github.event.pull_request.number }}/test-report
          keep_files: true

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const prNum = ${{ github.event.pull_request.number }};
            const base = `https://pandazxx.github.io/JenesBoot/pr-${prNum}`;
            const url       = `${base}/`;
            const qaUrl     = `${base}/qa/`;
            const reportUrl = `${base}/test-report/`;
            const marker = '<!-- pr-preview-comment -->';
            const body = [
              marker,
              `🔍 **Preview:** ${url}`,
              `🧪 **QA viewer:** ${qaUrl}`,
              `📊 **Test report:** ${reportUrl}`,
              '',
              '_Updated on every push to this PR._',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy-production:
    name: deploy production
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/
          keep_files: true

  deploy-test-report-production:
    name: deploy test report (production)
    needs: deploy-production
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Deploy test report to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: test-results/
          destination_dir: test-report
          keep_files: true

  cleanup-preview:
    name: cleanup preview
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove PR preview directory
        run: |
          PR="${{ github.event.pull_request.number }}"
          if [ -d "pr-${PR}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "pr-${PR}/"
            git commit -m "chore: remove preview for PR #${PR}"
            git push
          else
            echo "No preview directory for PR #${PR}, nothing to clean up."
          fi
